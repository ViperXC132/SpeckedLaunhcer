[package]
name = "specked_launcher"
version = "0.1.0"
description = "Specked Minecraft Launcher"
authors = ["ViperXC132"]
edition = "2021"

[lib]
name = "specked_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.8.0" }

[dependencies]
tauri = { version = "2.8.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

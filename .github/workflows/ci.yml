name: Specked CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: 22
  SPECKED_CI_ENABLED: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check CI switch
        if: ${{ env.SPECKED_CI_ENABLED != 'true' }}
        run: echo "Specked CI is disabled" && exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Typecheck and build frontend
        run: npm run build

      - name: Check Rust backend
        working-directory: src-tauri
        run: cargo check

  windows:
    runs-on: windows-latest
    steps:
      - name: Check CI switch
        if: ${{ env.SPECKED_CI_ENABLED != 'true' }}
        run: echo "Specked CI is disabled" && exit 0

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm install

      - name: Typecheck and build frontend
        run: npm run build

      - name: Build Windows application
        run: npm run tauri build

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: specked-launcher-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
